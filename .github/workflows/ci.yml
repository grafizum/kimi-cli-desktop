# CI for the WEB EDITION branch (kimi-web-desktop).
#   • smoke — dependency-free contract checks (run anywhere, no npm install)
#   • package — a real electron-builder --dir run per OS, proving the app
#     actually packages (catches files missing from the "build.files" list)
# The CLI edition (branch main) additionally drives a full Electron e2e;
# this edition's runtime surface is one webview, covered by the live checks
# in main.js and the smoke contracts here.
name: CI

on:
  push:
    branches: [kimi-web-desktop]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deliberately no `npm ci`: the smoke suite is written to work with zero
      # dependencies, so it also proves a fresh clone can be checked quickly.
      - run: node scripts/smoke-test.js

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --dir packs the app without producing installers: fast, and it proves
      # the "files" globs include everything main.js needs at runtime.
      - run: npm run ${{ matrix.script }} -- --dir --publish never
      - name: The packed app exists
        shell: bash
        run: |
          # The unpacked Linux binary is named after the package
          # (kimi-cli-desktop-web); macOS makes a .app bundle, Windows an exe.
          found=$(find dist -maxdepth 3 \( -name "*.exe" -o -name "kimi-cli-desktop-web" -o -name "*.app" \) | head -5)
          echo "$found"
          [ -n "$found" ] || { echo "::error::electron-builder produced no app"; exit 1; }
