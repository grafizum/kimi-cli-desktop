# The README's test contract, in CI:
#   • smoke — dependency-free, runs anywhere (no npm install needed)
#   • e2e   — drives a real Electron window with the fake kimi binary
#             (Linux headless through xvfb, Windows on the session desktop)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deliberately no `npm ci`: the smoke suite is written to work with zero
      # dependencies, so it also proves a fresh clone can be checked quickly.
      - run: node scripts/smoke-test.js

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run: xvfb-run -a node scripts/e2e-test.js
          - os: windows-latest
            run: node scripts/e2e-test.js
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # xvfb is not preinstalled on ubuntu-latest; electron needs a display.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y xvfb
      - run: npm ci
      - run: ${{ matrix.run }}
