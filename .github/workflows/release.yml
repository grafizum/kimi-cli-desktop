# Release pipeline:
#   git tag v1.2.3      && git push origin v1.2.3      -> CLI edition (branch main)
#   git tag web-v1.0.0  && git push origin web-v1.0.0  -> Web edition (branch kimi-web-desktop)
# builds the installers on all three OSes and attaches them to the release,
# which is exactly what install.ps1 / install.sh then download for users.
#
# This file lives on BOTH branches and dispatches on the tag prefix:
#   v*      -> the CLI edition (tabs + TUI), artifacts  Kimi-Code-Desktop-*
#   web-v*  -> the Web edition (embedded `kimi web`),   Kimi-Code-Desktop-Web-*
# The two editions never share a release, so `releases/latest` (what the
# install scripts resolve) always points at the most recent tag of either
# edition — publish them alternately with care.
#
# Artifact names come from package.json "build" (electron-builder):
#   Kimi-Code-Desktop-<version>-x64-portable.exe       (Windows, CLI edition)
#   Kimi-Code-Desktop-Setup-<version>-x64.exe          (Windows NSIS, CLI edition)
#   Kimi-Code-Desktop-Web-<version>-x64-portable.exe   (Windows, Web edition)
#   Kimi-Code-Desktop-Web-Setup-<version>-x64.exe      (Windows NSIS, Web edition)
#   …-<version>-<arch>.AppImage / .dmg                 (Linux / macOS)
# The installers match on "portable.exe", ".AppImage" / ".dmg" + arch — keep
# the artifactName patterns in package.json stable or update the scripts.

name: Release

on:
  push:
    tags: ["v*", "web-v*"]

permissions:
  contents: write # create the release, upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the branch the TAG points at, not whatever the checkout
          # defaults to — a web-v* tag must build the kimi-web-desktop code.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Publish here would need GH_TOKEN and create three racing releases;
      # the release job below uploads everything in one step instead.
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg

  # Collect every OS build and attach the installers to the tag's release.
  # Must stay a separate job: without it the run goes green with no release,
  # and install.ps1 / install.sh resolve nothing from releases/latest.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Kimi Code Desktop ${{ startsWith(github.ref_name, 'web-') && '(Web edition)' || '' }} ${{ github.ref_name }}
          generate_release_notes: true
          # Never a draft or GitHub "pre-release": releases/latest — the URL
          # the README links to and the API both installers resolve — ignores
          # both, so a draft or prerelease would leave every install command
          # broken.
          draft: false
          prerelease: false
          files: dist/*
