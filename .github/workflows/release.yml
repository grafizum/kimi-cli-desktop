# Release pipeline — the README's "Releasing" section in action:
#   git tag v1.0.0 && git push origin v1.0.0
# builds the installers on all three OSes and attaches them to the release,
# which is exactly what install.ps1 / install.sh then download for users.
#
# Artifact names come from package.json "build" (electron-builder):
#   Kimi-Code-Desktop-<version>-x64-portable.exe   (Windows)
#   Kimi-Code-Desktop-Setup-<version>-x64.exe      (Windows NSIS)
#   Kimi-Code-Desktop-<version>-<arch>.AppImage    (Linux x64 + arm64)
#   Kimi-Code-Desktop-<version>-<arch>.dmg         (macOS x64 + arm64)
# The installers match on "portable.exe", ".AppImage" / ".dmg" + arch — keep
# the artifactName patterns in package.json stable or update the scripts.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Publish here would need GH_TOKEN and create three racing releases;
      # the release job below uploads everything in one step instead.
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg

  # Collect every OS build and attach the installers to the tag's release.
  # Must stay a separate job: without it the run goes green with no release,
  # and install.ps1 / install.sh resolve nothing from releases/latest.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Kimi Code Desktop ${{ github.ref_name }}
          generate_release_notes: true
          # Never a draft or GitHub "pre-release": releases/latest — the URL
          # the README links to and the API both installers resolve — ignores
          # both, so a draft or prerelease would leave every install command
          # broken.
          draft: false
          prerelease: false
          files: dist/*
