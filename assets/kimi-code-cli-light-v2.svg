<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- App-icon background (squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="#e9e9ea"/>

  <!-- terminal prompt / K monogram, flat single color -->
  <g stroke="#1670c9" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left vertical stroke of the K -->
    <path d="M 172 120 L 172 392"/>
    <!-- diagonals meet the vertical at its mid-point, forming the K and echoing a ">" prompt -->
    <path d="M 172 256 L 336 130"/>
    <path d="M 172 256 L 336 382"/>
  </g>

  <!-- cursor block, reinforcing "CLI" -->
  <rect x="356" y="352" width="52" height="52" rx="8" fill="#1670c9"/>
</svg>
